# The paper's own robustness protocol (section 5.3): Gaussian noise on the
# shared poses, sigma_xy 0-0.5 m, sigma_heading up to 1 degree. Plane 1:
# corrupts the poses upstream, so the warp AND the label alignment move
# together -- compare faults=correction_matrix, which moves only the warp.
name: pose_error
pipeline: {pose_error: {sigma_xy: 0.4, sigma_heading: 0.8}}
agent_scope: non-ego
sweep:
  - {}
  - {pipeline: {pose_error: {sigma_xy: 0.1, sigma_heading: 0.2}}}
  - {pipeline: {pose_error: {sigma_xy: 0.2, sigma_heading: 0.4}}}
  - {pipeline: {pose_error: {sigma_xy: 0.3, sigma_heading: 0.6}}}
  - {pipeline: {pose_error: {sigma_xy: 0.4, sigma_heading: 0.8}}}
  - {pipeline: {pose_error: {sigma_xy: 0.5, sigma_heading: 1.0}}}
