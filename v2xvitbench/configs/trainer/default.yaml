# The released training schedule: 60 epochs, Adam 1e-3, multistep decay.
name: default
epochs: 60
batch_size: 2
optimizer: adam
lr: 1.0e-3
weight_decay: 1.0e-4
eps: 1.0e-8
scheduler: multistep
lr_steps: [15, 50]
lr_gamma: 0.1
grad_clip: 35.0
amp: false          # off by default: HMSA masks with finfo.min, which is
                    # dtype-dependent, and attention statistics compared
                    # across runs should not vary with the AMP setting.
num_workers: 8         # data prep is the bottleneck, not the GPU: 1.00 ->
                       # 0.47 s/step on staged V2XSet (job 554487). Workers
                       # are seeded per-id in scripts/train.py; without that
                       # seeding they would all share the parent's RNG.
log_every: 20
eval_every: 5
checkpoint_every: 10
max_batches: null
