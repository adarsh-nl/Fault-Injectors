name: default
epochs: 60
batch_size: 2
optimizer: adam
lr: 2.0e-3
weight_decay: 1.0e-4
eps: 1.0e-8
scheduler: multistep
lr_steps: [40, 55]
lr_gamma: 0.1
grad_clip: 35.0
amp: false          # off by default: the threshold comparison sits near the
                    # fp16 precision floor at 0.01, and a bandwidth number that
                    # shifted with the AMP setting would not be a bandwidth
                    # number. Safe to enable for the encoder-dominated runs.
num_workers: 0
log_every: 20
eval_every: 5
checkpoint_every: 10
max_batches: null
