# Synthetic cooperative scenes from cpbench. No data needed: this is what the
# smoke tests and the quick-start commands run on.
name: synthetic_lidar
adapter: synthetic
track: lidar
fps: 10.0
max_cav: 3
n_frames: 16
n_agents: 3
n_objects: 4
grid:
  voxel_size: [0.8, 0.8]
  point_range: [-25.6, -25.6, -3.0, 25.6, 25.6, 1.0]
  downsample: 2               # must equal model.encoder.block_strides[0]
max_points_per_pillar: 32
max_pillars: 8000
categories: null
