# Paper model, via the OpenCOOD adapter (implementation step 12).
# Requires the separate Python 3.7 environment; see slurm/opencood_env.sbatch.
name: where2comm
backend: opencood
core_method: point_pillar_where2comm
hypes_yaml: null            # path to opencood/hypes_yaml/point_pillar_where2comm.yaml
checkpoint: null
channels: 256
num_anchors: 2
num_classes: 1
downsample: 4
score_threshold: 0.2        # OpenCOOD VoxelPostprocessor default
nms_iou: 0.15
mflops: 1400                # section VI-C
