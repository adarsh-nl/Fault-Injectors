# Control-plane faults (plane 3) -- LGCP's own decisions, corrupted at the
# RSU/CAV message boundary. Not reachable by tensor-level injection.
#
#   python -m lgcpbench.scripts.benchmark faults=control_plane
name: control_plane
pipeline: {}                 # physical (plane 1) faults: none
agent_scope: non-ego
seed: 2026

# Applied between protocol stages by ControlPlaneFaultBridge.
control_pipeline:
  confidence_report: {mode: inflate, magnitude: 0.3, p_affected: 0.3}
  leader_failure: {p_fail: 0.1}

sweep: []
control_sweep:
  - {confidence_report: {magnitude: [0.1, 0.3, 0.6]}}
  - {leader_failure: {p_fail: [0.05, 0.1, 0.25, 0.5]}}
  - {assignment_loss: {p_loss: [0.1, 0.25, 0.5]}}
  - {global_view: {magnitude: [0.75, 0.5, 0.25]}}
