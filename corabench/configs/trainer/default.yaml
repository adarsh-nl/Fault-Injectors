# Paper training settings (OpenCOOD base): Adam, 30 epochs, batch 2.
# This is the CLEAN training default -- no faults anywhere, so the clean
# baseline really is clean. For pose-noise-robust training use
# `trainer=robust` (see robust.yaml).
epochs: 30
batch_size: 2
num_workers: 4
optimizer: {lr: 1.0e-3, weight_decay: 1.0e-4}
scheduler: {milestones: [15, 25], gamma: 0.1}
amp: true
grad_clip: 10.0
val_every: 1
log_every: 50
train_noise: null
