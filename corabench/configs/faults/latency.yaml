# Paper Table 2: communication latency (stale collaborator frames) at a
# fixed high pose error (0.6 m / 0.6 deg). mu_delay in seconds.
name: latency
pipeline:
  latency: {mu_delay: 0.2, sigma_jitter: 0.02}
  pose_error: {sigma_xy: 0.6, sigma_heading: 0.6}
agent_scope: non-ego
sweep:
  - {pose_error: {sigma_xy: 0.6, sigma_heading: 0.6}}
  - {latency: {mu_delay: 0.1}, pose_error: {sigma_xy: 0.6, sigma_heading: 0.6}}
  - {latency: {mu_delay: 0.2}, pose_error: {sigma_xy: 0.6, sigma_heading: 0.6}}
  - {latency: {mu_delay: 0.3}, pose_error: {sigma_xy: 0.6, sigma_heading: 0.6}}
  - {latency: {mu_delay: 0.4}, pose_error: {sigma_xy: 0.6, sigma_heading: 0.6}}
