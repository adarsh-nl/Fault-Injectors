# Combined communication stress: agent dropout + bandwidth + pose error.
name: comm_stress
pipeline:
  agent_drop: {p_drop: 0.25}
  bandwidth: {keep_fraction: 0.5}
  pose_error: {sigma_xy: 0.4, sigma_heading: 0.4}
agent_scope: non-ego
sweep:
  - {}
  - {agent_drop: {p_drop: 0.25}}
  - {bandwidth: {keep_fraction: 0.5}}
  - {agent_drop: {p_drop: 0.25}, bandwidth: {keep_fraction: 0.5},
     pose_error: {sigma_xy: 0.4, sigma_heading: 0.4}}
