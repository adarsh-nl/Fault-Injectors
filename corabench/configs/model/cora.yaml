# CoRA architecture (paper defaults; assumption flags A1-A9 are logged).
name: cora
channels: 256
num_anchors: 2
num_classes: 1
# Regression channels per anchor. THE single source of truth: threaded to
# both DetectionHeads, PAC (via nreg_ch), the BoxDecoder, the
# TargetAssigner and the loss, and checked for agreement at startup by
# assert_reg_dim_consistent(). 7 = yaw as one sin channel, decoded by
# asin and 180-degree ambiguous; 8 = yaw as (sin, cos), decoded by atan2.
# corabench runs 8; cobevt/v2xvit/where2comm/lgcp keep the 7 default.
reg_dim: 8
vfe_channels: 64
block_channels: [64, 128, 256]
block_strides: [2, 2, 2]
block_layers: [3, 5, 5]
upsample_channels: 128
score_threshold: 0.2

cit:
  strategy: winner_take_all      # winner_take_all | topk | maxout
  topk: 2
  request_threshold: 0.01

cssm:
  d_inner: 64
  d_state: 16
  scan: cross2d                  # cross2d | raster        (A9)
  # dt_proj bias init. 'constant' is the original -2.0 (softplus 0.127, above
  # Mamba's dt_max before the weight term is even added); 'mamba' is the
  # reference dt_init, inverse-softplus of dt ~ exp(U(log 1e-3, log 1e-1)).
  # Default stays 'constant' so prior runs remain reproducible from config
  # alone -- see RECON-4. Only the BIAS changes; the weight is already at
  # Mamba's dt_init_std.
  dt_init: constant              # constant | mamba        (RECON-4)
  # Soft ceiling on Delta, applied every forward: dt_max * tanh(Delta/dt_max).
  # null = unbounded, which reproduces every run up to 549427. dt_init sets
  # where Delta STARTS; nothing held it during training and one landed step
  # took it 0.318 -> 4.85 -> 11.1. 0.2 distorts Mamba's [0.001, 0.1] init
  # range by <2%; 0.1 would distort its top by 24%, and 0.1 was never a
  # runtime ceiling anyway.
  dt_max: null                   # null | float            (RECON-4)
  pool: 2                        # scan at H/pool x W/pool; 1 = full res
  backend: reference             # reference | cuda (mamba-ssm)

lc:
  gate_hidden: 128
  conv_layers: 2

pac:
  pe_dim: 64
  kernel_size: 3
  select_hidden: 32

fusion:
  nms_iou: 0.15
  recalibration: sigmoid_neg     # sigmoid_neg | one_minus (A4)

teacher_enabled: true

loss:
  w_local: 1.0
  w_lc: 1.0
  w_pac: 1.0
  lambda_align: 1.0              # A6
  alpha: 0.25
  gamma: 2.0
  reg_weight: 2.0
  local_scope: all
  u_reg: 1.0e-4

assumptions:
  A1_attention: pixel_pair_att_fusion
  A2_s_coll: winner_confidence
  A3_pac_fuse: conv_concat
  A4_recalibration: sigmoid_neg
  # Was `shared_lc_dense_weighted` until 5813c24 replaced shared weights with
  # an independent EMA target network. This string is copied verbatim into
  # ExperimentMeta.assumptions and written to every bundle's meta.json, so a
  # stale value here is a false claim inside the artifact, not just the docs.
  A5_teacher: ema_target_network_m0.999_dense_weighted
  A6_loss: focal_smoothl1_all_branches
  A7_pe: sinusoidal_8param
  A8_yaw: sin_encoding_no_dir_classifier
  A9_scan: cross2d_reference
