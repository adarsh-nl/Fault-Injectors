# OPV2V LiDAR track: PointPillars + FuseBEVT detection (paper Table 2).
name: opv2v_lidar
adapter: opv2v
track: lidar
root: ${data_root}/opencood/opv2v
split: {train: train, val: validate, test: test}
fps: 10.0
max_cav: 5
# Voxel (0.4, 0.4, 4) m; range chosen so the pillar grid divides by the
# backbone stride product (paper Appendix C.3).
grid:
  voxel_size: [0.4, 0.4]
  point_range: [-51.2, -51.2, -3.0, 51.2, 51.2, 1.0]
  downsample: 2
max_points_per_pillar: 32
max_pillars: 32000
categories: [car]
