# Localisation error on collaborators.
#
# Under intermediate fusion this perturbs the STTF warp, not the features:
# a collaborator's BEV map arrives intact but lands in the wrong place, and
# attention has a chance to notice the disagreement. Read
# fusebevt/d*/local/softmax to see whether it does.
#
# sigma_heading is in DEGREES (PoseErrorInjector's convention). Each sweep
# entry is a complete fault-bridge config, so injectors go under `pipeline`.
name: pose_error
pipeline:
  pose_error: {sigma_xy: 0.4, sigma_heading: 0.4}
agent_scope: non-ego
sweep:
  - {}
  - {pipeline: {pose_error: {sigma_xy: 0.2, sigma_heading: 0.2}}}
  - {pipeline: {pose_error: {sigma_xy: 0.4, sigma_heading: 0.4}}}
  - {pipeline: {pose_error: {sigma_xy: 0.6, sigma_heading: 0.6}}}
  - {pipeline: {pose_error: {sigma_xy: 0.8, sigma_heading: 0.8}}}
